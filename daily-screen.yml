name: Daily S&P 500 undervalued screen

# GitHub cron is UTC, doesn't follow daylight saving, and — crucially — start
# times routinely drift 15-60+ minutes past the scheduled minute. So instead of
# gating on "is the clock hour exactly 5 in Chicago" (which a late start
# silently fails), we gate on "has the page already been refreshed today?".
# Three slots fire; the first one to actually start does the work, the others
# see today's refresh already committed and exit in seconds.
on:
  schedule:
    - cron: "0 10 * * *"    # 5:00 AM Chicago during daylight time
    - cron: "0 11 * * *"    # 5:00 AM during standard time; retry slot in summer
    - cron: "30 12 * * *"   # late backup in case both earlier starts were delayed
  workflow_dispatch:        # manual runs always refresh, regardless of the gate

permissions:
  contents: write           # needed to commit the regenerated index.html

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so the gate can see when index.html last changed

      - name: Should we refresh today?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, subprocess, datetime
          from zoneinfo import ZoneInfo
          tz = ZoneInfo("America/Chicago")
          now = datetime.datetime.now(tz)
          manual = os.environ.get("EVENT") == "workflow_dispatch"
          out = subprocess.run(
              ["git", "log", "-1", "--format=%cI", "--", "index.html"],
              capture_output=True, text=True).stdout.strip()
          last = (datetime.datetime.fromisoformat(out).astimezone(tz).date()
                  if out else None)
          # Run if triggered manually, or if the page hasn't been refreshed
          # today yet AND we're past 5 AM Chicago (keeps the winter 10:00 UTC
          # slot, which is 4 AM Central, from refreshing an hour early).
          go = manual or ((last is None or last < now.date()) and now.hour >= 5)
          print(f"Chicago {now:%Y-%m-%d %H:%M %Z} · last refresh {last} · manual={manual} -> run={go}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"go={'true' if go else 'false'}\n")
          PY

      - name: Set up Python
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the screen and rebuild the page
        if: steps.gate.outputs.go == 'true'
        run: python screen.py

      - name: Publish if anything changed
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "stock-screen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/snapshots
          if git diff --staged --quiet; then
            echo "No change in the page — nothing to publish."
          else
            git commit -m "Daily refresh: $(date -u +'%Y-%m-%d')"
            git push
            echo "Published."
          fi
