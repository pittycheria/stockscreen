name: Daily S&P 500 undervalued screen

# GitHub cron is UTC and does not follow daylight saving, so we fire at both
# 10:00 and 11:00 UTC and let the job itself continue only when it is 5 AM in
# Chicago. That lands at 5:00 AM Central year round.
on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write           # needed to commit the regenerated index.html

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Is it 5 AM in Chicago?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, datetime
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo("America/Chicago"))
          manual = os.environ.get("EVENT") == "workflow_dispatch"
          go = manual or now.hour == 5
          print(f"Chicago time {now:%Y-%m-%d %H:%M %Z} · manual={manual} · run={go}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"go={'true' if go else 'false'}\n")
          PY

      - name: Set up Python
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the screen and rebuild the page
        if: steps.gate.outputs.go == 'true'
        run: python screen.py

      - name: Publish if anything changed
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "stock-screen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No change in the page — nothing to publish."
          else
            git commit -m "Daily refresh: $(date -u +'%Y-%m-%d')"
            git push
            echo "Published."
          fi
