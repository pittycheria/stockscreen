name: Daily S&P 500 undervalued screen

# Minutes are off :00 deliberately - top-of-hour is GitHub's most congested
# scheduling window, where runs get delayed or dropped. The gate below asks
# "has the page been rebuilt today?" so a late firing still publishes and
# same-day repeats exit in seconds.
on:
  schedule:
    - cron: "17 10 * * *"   # ~5:17 AM Chicago in summer
    - cron: "23 11 * * *"   # retry
    - cron: "41 12 * * *"   # retry
    - cron: "33 16 * * *"   # last-resort catch-up
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so the gate can see when index.html last changed

      - name: Should we refresh today?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, subprocess, datetime
          from zoneinfo import ZoneInfo
          tz = ZoneInfo("America/Chicago")
          now = datetime.datetime.now(tz)
          manual = os.environ.get("EVENT") == "workflow_dispatch"
          out = subprocess.run(
              ["git", "log", "-1", "--format=%cI", "--", "index.html"],
              capture_output=True, text=True).stdout.strip()
          last = (datetime.datetime.fromisoformat(out).astimezone(tz).date()
                  if out else None)
          go = manual or ((last is None or last < now.date()) and now.hour >= 5)
          print(f"Chicago {now:%Y-%m-%d %H:%M %Z} · last refresh {last} · manual={manual} -> run={go}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"go={'true' if go else 'false'}\n")
          PY

      - name: Set up Python
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the screen and rebuild the page
        if: steps.gate.outputs.go == 'true'
        run: python screen.py

      - name: Publish
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "stock-screen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Daily refresh: $(date -u +'%Y-%m-%d')"
            git push || (git pull --rebase --autostash && git push)
          fi
